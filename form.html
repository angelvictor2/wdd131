<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Angel Victor">
    <meta name="description" content="Product review form created by Angel Victor for Week 05 JavaScript assignment.">
    <title>Product Review – Week 05</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Name</legend>
                <label for="product"></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>-- Select a Product --</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Overall Rating</legend>
                <label class="rating">
                    <input type="radio" id="rating1" name="rating" value="1" required>☆
                </label>
                <label class="rating">
                    <input type="radio" id="rating2" name="rating" value="2" >☆☆
                </label>
                <label class="rating">
                    <input type="radio" id="rating3" name="rating" value="3" >☆☆☆
                </label>
                <label class="rating">
                    <input type="radio" id="rating4" name="rating" value="4" >☆☆☆☆
                </label>
                <label class="rating">
                    <input type="radio" id="rating5" name="rating" value="5" >☆☆☆☆☆
                </label>
            </fieldset>
            <fieldset>
                <legend>Date Of installation</legend>
                <label for="installationDate"></label>
                <input type="date" id="installationDate" name="installationDate" required>
            </fieldset>
            <fieldset>
                <legend>Useful Features</legend>
                <label for="feature1"><input type="checkbox" id="feature1" name="features" value="Durability"> Durability</label>
                <label for="feature2"><input type="checkbox" id="feature2" name="features" value="Ease of use"> Ease of Use</label>
                <label for="feature3"><input type="checkbox" id="feature3" name="features" value="Performance"> Performance</label>
                <label for="feature4"><input type="checkbox" id="feature4" name="features" value="Design"> Design</label>
            </fieldset>
            <fieldset>
                <legend>Written Review (optional)</legend>
                <label for="review"></label>
                <textarea name="review" id="review" rows="4" cols="50"></textarea>
            </fieldset>
            <fieldset>
                <legend>Your Name (optional)</legend>
                <label for="userName"></label>
                <input type="text" name="userName" id="userName">
            </fieldset>
            <fieldset>
                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Angel Victor Escobedo – Guatemala</p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
